<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyric Aligner</title>
<style>
  :root { color-scheme: dark; --bg:#1e1e22; --panel:#26262b; --line:#3a3a42; --text:#e8e8ec; --muted:#9a9aa6;
          --note:#4f8cff; --sel:#ffb454; --mel:#6d6d78; --over:#ff5c5c; --rest:#2f2f36; --ok:#5fd18a; }
  * { box-sizing:border-box } body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text) }
  header { position:sticky; top:0; z-index:3; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  header .name { font-weight:600 } header .muted { color:var(--muted) }
  button { background:#3b3b44; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit }
  button:hover { background:#4a4a55 } button:disabled { opacity:.4; cursor:default } button.primary { background:#2f5fbf; border-color:#3b6fd6 }
  #toolbar { position:sticky; top:44px; z-index:2; background:var(--panel); border-bottom:1px solid var(--line); padding:6px 12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap }
  #toolbar .hint { color:var(--muted); margin-left:auto }
  main { padding:10px 12px 60px }
  section.sec { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:10px 0; padding:8px 10px }
  section.sec h3 { margin:0 0 6px; font-size:14px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap }
  section.sec h3 .st { font-weight:400; color:var(--muted) } .st.bad { color:var(--over) } .st.good { color:var(--ok) }
  .roll { overflow-x:auto; padding-bottom:4px }
  svg { display:block } text { font:11px system-ui, sans-serif; fill:var(--text) } text.syl { font-size:12px } text.mel { fill:var(--muted) }
  text.bar { fill:var(--muted); font-size:10px } text.over { fill:var(--over) }
  rect.note { fill:var(--note); stroke:#1b3a80; cursor:pointer } rect.note.mel { fill:var(--mel); stroke:#444 } rect.note.sel { fill:var(--sel); stroke:#8a5a00 }
  rect.note.play { fill:#9be0ff } rect.rest { fill:var(--rest); stroke:none; cursor:pointer } rect.rest:hover { fill:#3d3d47 }
  .legend { color:var(--muted); font-size:12px; margin:4px 0 0 }
  #msg { color:var(--muted) } #msg.err { color:var(--over) }
  .lines { margin:6px 0 0; color:var(--muted); font-size:12px } .lines b { color:var(--text); font-weight:500 }
  #lyricsbox { display:none; margin:10px 0 } textarea { width:100%; min-height:160px; background:#141416; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:13px/1.4 ui-monospace, monospace }
</style>
</head>
<body>
<header>
  <span class="name" id="title">Lyric Aligner</span>
  <span class="muted" id="meta"></span>
  <button id="undo" title="Undo the last change">↶ Undo</button>
  <button id="reset" title="Back to the transcription, discarding all edits">Reset</button>
  <button id="editlyrics" title="Edit the lyrics used for the syllables (does not change the ComfyUI text box)">Lyrics…</button>
  <button id="audio" title="Play the original recording from the selected note's bar">▶ Original</button>
  <button id="synth" title="Play the notes of the selected section as a simple synth, with the syllables">▶ Synth</button>
  <button id="stop">■</button>
  <span id="msg"></span>
</header>
<div id="toolbar">
  <span class="muted">Selected note:</span> <span id="selinfo">none</span>
  <button data-op="split" title="One note becomes two of the same pitch: room for one more syllable">✂ Split</button>
  <button data-op="merge" title="This note swallows the next one: one syllable fewer">⇢ Merge with next</button>
  <button data-op="longer" title="Take a little time from what follows in the bar">＋ Longer</button>
  <button data-op="shorter" title="Give a little time to a rest after this note">－ Shorter</button>
  <button data-op="up" title="One scale step higher (stays in key)">↑ Up</button>
  <button data-op="down" title="One scale step lower (stays in key)">↓ Down</button>
  <button data-op="silence" title="Turn this note into a rest">✕ Silence</button>
  <span class="hint">Click a note to select it · click a grey rest to add a pickup note there · edits save automatically; queue the workflow again to render</span>
</div>
<main>
  <div id="lyricsbox">
    <textarea id="lyrics"></textarea>
    <div style="margin-top:6px; display:flex; gap:8px; align-items:center">
      <label>Language <select id="language"></select></label>
      <button id="applylyrics" class="primary">Apply</button>
      <span class="muted">Tip: hyphenate a word (ev-ery) to force how it splits into syllables.</span>
    </div>
  </div>
  <div id="sections"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const NAME = qs.get("name") || "";
const LANGS = ["English","Chinese","Japanese","Russian","Korean","Spanish","Portuguese","French","German","Polish","Swedish","Dutch","Indonesian","Tagalog","Persian","Bengali","Arabic","Italian","Ukrainian","Hindi","Urdu","Hebrew","Other"];
let S = null;            // current view payload
let history = [];        // previous ABC strings for undo
let selected = null;     // sung note id
let audioEl = null, synthCtx = null, synthTimer = null;
const PX_PER_UNIT_BASE = 6;

function $(id){ return document.getElementById(id); }
function say(t, err){ const m=$("msg"); m.textContent=t||""; m.className = err ? "err" : ""; }

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load(){
  try { S = await api(`/yue2sml/session?name=${encodeURIComponent(NAME)}`); }
  catch(e){ say(e.message, true); return; }
  $("title").textContent = `Lyric Aligner · ${S.name}`;
  $("meta").textContent = `key ${S.key} · ${S.bpm} BPM · ${S.language}${S.edited ? " · EDITED" : ""}`;
  $("audio").disabled = !S.has_audio;
  const sel = $("language"); if (!sel.options.length) LANGS.forEach(l => { const o=document.createElement("option"); o.value=o.textContent=l; sel.appendChild(o); });
  sel.value = S.language; $("lyrics").value = S.lyrics;
  render();
}

function secondsPerUnit(){ return (60 / S.bpm) * (4 / S.unit_den); }

function render(){
  const root = $("sections"); root.innerHTML = "";
  const pxu = Math.max(3, Math.min(10, Math.round(PX_PER_UNIT_BASE * 32 / S.unit_den)));  // similar width per bar for L:1/16 and L:1/32
  S.sections.forEach((sec, si) => {
    const el = document.createElement("section"); el.className = "sec";
    const diff = sec.syllable_count - sec.note_count;
    const st = !sec.tag ? '<span class="st bad">no lyrics section for this part</span>'
             : Math.abs(diff) <= Math.max(2, Math.floor(sec.note_count/10)) ? '<span class="st good">fits</span>'
             : diff > 0 ? `<span class="st bad">${diff} syllable${diff>1?"s":""} without a note → split notes or add pickups</span>`
             : `<span class="st">${-diff} note${-diff>1?"s":""} without a syllable (held vowels, shown as ~)</span>`;
    el.innerHTML = `<h3>${sec.name} <span class="st">${sec.note_count} notes</span> ↔ ${sec.tag ? "["+sec.tag+"]" : ""} <span class="st">${sec.syllable_count} syllables</span> ${st}</h3>`;
    el.appendChild(roll(sec, si, pxu));
    if (sec.lines.length) {
      const lines = document.createElement("div"); lines.className = "lines";
      lines.innerHTML = sec.lines.map((l, i) => `<b>${i+1}.</b> ${l.join("·")}`).join(" &nbsp; ");
      el.appendChild(lines);
    }
    if (sec.overflow.length) {
      const o = document.createElement("div"); o.className = "lines";
      o.innerHTML = `<span style="color:var(--over)">No note yet for:</span> ${sec.overflow.map(x=>x.text).join(" ")}`;
      el.appendChild(o);
    }
    root.appendChild(el);
  });
  const legend = document.createElement("div"); legend.className = "legend";
  legend.textContent = "Blue = sung note with its syllable · grey = held note (~, the syllable continues) · dark gaps = rests (click to add a pickup note) · height = pitch";
  root.appendChild(legend);
}

function roll(sec, si, pxu){
  const notes = sec.notes;
  if (!notes.length) return document.createElement("div");
  const start0 = notes[0].start, barsIdx = new Set(notes.map(n=>n.bar));
  const firstBar = Math.min(...notes.map(n=>n.bar)), lastBar = Math.max(...notes.map(n=>n.bar));
  const bars = S.bars.slice(firstBar, lastBar+1);
  let x0 = S.bars.slice(0, firstBar).reduce((a,b)=>a+b.units, 0);
  const totalUnits = bars.reduce((a,b)=>a+b.units,0);
  const W = totalUnits*pxu + 40, H = 150;
  const lo = Math.min(...notes.map(n=>n.pitch)), hi = Math.max(...notes.map(n=>n.pitch));
  const y = p => 18 + (hi - p) * Math.min(9, 96/Math.max(1, hi-lo));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const wrap = document.createElement("div"); wrap.className = "roll"; wrap.appendChild(svg);
  // bars
  let x = 20, u = x0;
  bars.forEach((b, i) => {
    const l = document.createElementNS(NS, "line"); l.setAttribute("x1", x); l.setAttribute("x2", x); l.setAttribute("y1", 8); l.setAttribute("y2", H-30); l.setAttribute("stroke", "#3a3a42"); svg.appendChild(l);
    const t = document.createElementNS(NS, "text"); t.setAttribute("x", x+3); t.setAttribute("y", 8+8); t.setAttribute("class", "bar"); t.textContent = `bar ${b.index+1}`; svg.appendChild(t);
    // rests inside this bar
    S.rests.filter(r => r.bar === b.index).forEach(r => {
      const rr = document.createElementNS(NS, "rect"); rr.setAttribute("x", 20 + (r.start - x0)*pxu); rr.setAttribute("y", 20); rr.setAttribute("width", Math.max(2, r.dur*pxu-1)); rr.setAttribute("height", H-58); rr.setAttribute("class", "rest");
      rr.addEventListener("click", () => sing(r)); const title = document.createElementNS(NS, "title"); title.textContent = "rest: click to add a pickup note here"; rr.appendChild(title); svg.appendChild(rr);
    });
    x += b.units*pxu; u += b.units;
  });
  // notes
  notes.forEach(n => {
    const rx = 20 + (n.start - x0)*pxu, w = Math.max(3, n.dur*pxu - 1);
    const r = document.createElementNS(NS, "rect"); r.setAttribute("x", rx); r.setAttribute("y", y(n.pitch)-6); r.setAttribute("width", w); r.setAttribute("height", 12); r.setAttribute("rx", 2);
    r.setAttribute("class", "note" + (n.syllable.line === null ? " mel" : "") + (selected === n.id ? " sel" : "")); r.dataset.id = n.id;
    r.addEventListener("click", () => select(n.id));
    const tt = document.createElementNS(NS, "title"); tt.textContent = `${n.name} · ${n.dur} units · bar ${n.bar+1}`; r.appendChild(tt); svg.appendChild(r);
    const t = document.createElementNS(NS, "text"); t.setAttribute("x", rx + 1); t.setAttribute("y", H-14); t.setAttribute("class", "syl" + (n.syllable.line === null ? " mel" : "")); t.textContent = n.syllable.text; svg.appendChild(t);
    const pn = document.createElementNS(NS, "text"); pn.setAttribute("x", rx + 1); pn.setAttribute("y", y(n.pitch) - 8); pn.setAttribute("class", "bar"); pn.textContent = n.name; svg.appendChild(pn);
  });
  return wrap;
}

function noteById(id){ for (const s of S.sections) for (const n of s.notes) if (n.id === id) return n; return null; }
function sectionOf(id){ for (const s of S.sections) if (s.notes.some(n=>n.id===id)) return s; return null; }

function select(id){
  selected = id; const n = noteById(id);
  $("selinfo").textContent = n ? `#${id} ${n.name}, ${n.dur} units, bar ${n.bar+1}, syllable "${n.syllable.text}"` : "none";
  document.querySelectorAll("rect.note").forEach(r => r.classList.toggle("sel", Number(r.dataset.id) === id));
}

async function doOp(op){
  if (selected === null) { say("select a note first", true); return; }
  history.push(S.abc);
  try {
    const r = await api("/yue2sml/op", {name: NAME, abc: S.abc, op, note_id: selected});
    S = Object.assign(S, r); say(r.msg); $("meta").textContent = `key ${S.key} · ${S.bpm} BPM · ${S.language} · EDITED`;
    render(); select(selected);
  } catch(e){ history.pop(); say(e.message, true); }
}
async function sing(r){
  history.push(S.abc);
  try {
    const j = await api("/yue2sml/op", {name: NAME, abc: S.abc, op: "sing", bar: r.bar, pos: r.pos});
    S = Object.assign(S, j); say(j.msg); render();
  } catch(e){ history.pop(); say(e.message, true); }
}
async function setAbc(abc){
  try { const j = await api("/yue2sml/set", {name: NAME, abc}); S = Object.assign(S, j); render(); select(selected); $("meta").textContent = `key ${S.key} · ${S.bpm} BPM · ${S.language}${S.edited ? " · EDITED" : ""}`; }
  catch(e){ say(e.message, true); }
}

// ---- playback
function stopAll(){ if (audioEl) { audioEl.pause(); } if (synthTimer) { clearTimeout(synthTimer); synthTimer = null; } document.querySelectorAll("rect.play").forEach(r=>r.classList.remove("play")); }
function playOriginal(){
  stopAll();
  const n = selected !== null ? noteById(selected) : (S.sections[0] && S.sections[0].notes[0]);
  if (!n || !S.bar_times.length) { say("no original audio / bar timing for this session", true); return; }
  const sec = sectionOf(n.id) || S.sections[0];
  const t0 = S.bar_times[n.bar], lastBar = Math.max(...sec.notes.map(x=>x.bar));
  const t1 = S.bar_times[lastBar+1] || (t0 + 20);
  if (!audioEl) { audioEl = new Audio(`/yue2sml/audio?name=${encodeURIComponent(NAME)}`); }
  audioEl.currentTime = t0; audioEl.play();
  say(`original: bar ${n.bar+1} (${t0.toFixed(1)} s) to bar ${lastBar+1}`);
  const stopAt = () => { if (audioEl.currentTime >= t1) { audioEl.pause(); audioEl.removeEventListener("timeupdate", stopAt); } };
  audioEl.addEventListener("timeupdate", stopAt);
}
function playSynth(){
  stopAll();
  const sec = selected !== null ? sectionOf(selected) : S.sections[0];
  if (!sec) return;
  const notes = selected !== null ? sec.notes.filter(n => n.id >= selected) : sec.notes;
  if (!synthCtx) synthCtx = new (window.AudioContext || window.webkitAudioContext)();
  const spu = secondsPerUnit(), t = synthCtx.currentTime + 0.05, start0 = notes[0].start;
  notes.forEach(n => {
    const at = t + (n.start - start0)*spu, dur = n.dur*spu;
    const o = synthCtx.createOscillator(), g = synthCtx.createGain();
    o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (n.pitch-69)/12);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.25, at+0.02); g.gain.exponentialRampToValueAtTime(0.0001, at+dur*0.95);
    o.connect(g).connect(synthCtx.destination); o.start(at); o.stop(at+dur);
    setTimeout(() => { document.querySelectorAll("rect.play").forEach(r=>r.classList.remove("play")); const r = document.querySelector(`rect.note[data-id="${n.id}"]`); if (r) r.classList.add("play"); say(`♪ ${n.name}  "${n.syllable.text}"`); }, (at - synthCtx.currentTime)*1000);
  });
  const total = (notes[notes.length-1].start + notes[notes.length-1].dur - start0)*spu;
  synthTimer = setTimeout(() => { document.querySelectorAll("rect.play").forEach(r=>r.classList.remove("play")); }, total*1000 + 200);
}

document.querySelectorAll("#toolbar button[data-op]").forEach(b => b.addEventListener("click", () => doOp(b.dataset.op)));
$("undo").addEventListener("click", () => { if (!history.length) { say("nothing to undo"); return; } setAbc(history.pop()); });
$("reset").addEventListener("click", () => { if (confirm("Discard all edits and go back to the transcription?")) { history = []; setAbc(null); } });
$("editlyrics").addEventListener("click", () => { const b = $("lyricsbox"); b.style.display = b.style.display === "block" ? "none" : "block"; });
$("applylyrics").addEventListener("click", async () => {
  try { const j = await api("/yue2sml/lyrics", {name: NAME, lyrics: $("lyrics").value, language: $("language").value}); S = Object.assign(S, j); render(); say("lyrics updated for the alignment view (paste the same text into ComfyUI's NEW LYRICS box before rendering)"); }
  catch(e){ say(e.message, true); }
});
$("audio").addEventListener("click", playOriginal);
$("synth").addEventListener("click", playSynth);
$("stop").addEventListener("click", stopAll);
window.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const map = {"s":"split","m":"merge","+":"longer","=":"longer","-":"shorter","ArrowUp":"up","ArrowDown":"down","x":"silence"};
  if (map[e.key]) { e.preventDefault(); doOp(map[e.key]); }
  if (e.key === "ArrowRight" && selected !== null) { e.preventDefault(); select(Math.min(selected+1, Math.max(...S.sections.flatMap(s=>s.notes.map(n=>n.id))))); }
  if (e.key === "ArrowLeft" && selected !== null) { e.preventDefault(); select(Math.max(selected-1, 0)); }
  if (e.key === " ") { e.preventDefault(); playSynth(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("undo").click(); }
});
load();
</script>
</body>
</html>
